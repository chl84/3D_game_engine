name: CI

# CI runs for pull requests to main, pushes to main and manual dispatches.
# Feature-branch pushes do not trigger CI; open a pull request or run the
# workflow manually when a feature branch needs verification.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_VERSION: 4.4.5
  NINJA_VERSION: 1.13.2

jobs:
  linux:
    name: Linux (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        preset:
          - ci-linux-gcc14
          - ci-linux-clang
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore vcpkg binary cache
        uses: actions/cache@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-overlay/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout 0e5eb43501dab17aa055dd54bd7a8c018f330fe2
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Set up Python tools
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-dev.txt

      - name: Install Vulkan and lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan1 mesa-vulkan-drivers vulkan-tools vulkan-validationlayers \
            g++-14 libx11-dev libxft-dev libxext-dev libwayland-dev \
            libxkbcommon-dev libegl1-mesa-dev xvfb openbox

      - name: Restore pinned Vulkan SDK cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.vulkan-sdk
          key: vulkan-sdk-1.4.363.0-${{ runner.os }}

      - name: Install pinned glslc
        run: |
          sdk_root="$GITHUB_WORKSPACE/.vulkan-sdk/1.4.363.0/x86_64"
          if [ ! -x "$sdk_root/bin/glslc" ]; then
            archive="$RUNNER_TEMP/vulkansdk-linux-x86_64-1.4.363.0.tar.xz"
            curl -fsSL -o "$archive" \
              "https://sdk.lunarg.com/sdk/download/1.4.363.0/linux/vulkansdk-linux-x86_64-1.4.363.0.tar.xz"
            expected="197962f5cbf80baf2775a03336a01cee7c8745686c65aaa70d3f751ade4d7e43"
            actual="$(sha256sum "$archive" | cut -d ' ' -f1)"
            if [ "$actual" != "$expected" ]; then
              echo "Vulkan SDK checksum mismatch: $actual" >&2
              exit 1
            fi
            mkdir -p "$GITHUB_WORKSPACE/.vulkan-sdk"
            tar -xJf "$archive" -C "$GITHUB_WORKSPACE/.vulkan-sdk"
          fi
          test -x "$sdk_root/bin/glslc"
          echo "$sdk_root/bin" >> "$GITHUB_PATH"
          echo "VULKAN_SDK=$sdk_root" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$sdk_root/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          "$sdk_root/bin/glslc" --version

      - name: Verify glslc
        run: |
          glslc --version
          test "$(command -v glslc)" = "$VULKAN_SDK/bin/glslc"

      - name: Select the lavapipe ICD
        run: |
          icd="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          echo "Using $icd"

      - name: Install pinned CMake and Ninja
        run: |
          cmake_archive="/tmp/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz"
          ninja_archive="/tmp/ninja-${NINJA_VERSION}-linux.zip"
          curl -fsSL -o "$cmake_archive" \
            "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz"
          curl -fsSL -o "$ninja_archive" \
            "https://github.com/ninja-build/ninja/releases/download/v${NINJA_VERSION}/ninja-linux.zip"
          mkdir -p "$HOME/.local/cmake" "$HOME/.local/bin"
          tar -xzf "$cmake_archive" -C "$HOME/.local/cmake" --strip-components=1
          unzip -q -o "$ninja_archive" -d "$HOME/.local/bin"
          echo "$HOME/.local/cmake/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify pinned build tools
        run: |
          test "$(cmake --version | head -n 1)" = "cmake version ${CMAKE_VERSION}"
          test "$(ninja --version)" = "${NINJA_VERSION}"
          cmake --version | head -n 1
          ninja --version

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # Run the whole CTest suite under Xvfb + openbox so the window and
      # swapchain tests actually execute instead of being skipped as headless.
      - name: Test
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" bash -c '
            openbox --sm-disable &
            wm=$!
            sleep 1
            ctest --preset ${{ matrix.preset }} --output-on-failure
            code=$?
            kill "$wm" 2>/dev/null || true
            exit "$code"
          '

      # Keep the strict minimize contract in addition to the CTest run.
      - name: Swapchain minimize with Xvfb
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" bash -c '
            openbox --sm-disable &
            wm=$!
            sleep 1
            ./build/${{ matrix.preset }}/tests/engine_swapchain_test --require-minimize
            code=$?
            kill "$wm" 2>/dev/null || true
            exit "$code"
          '

      - name: Render test summary
        run: ctest --preset ${{ matrix.preset }} -R "engine_render_tests|engine_pbr_golden" -V

      - name: Core test summary
        run: ctest --preset ${{ matrix.preset }} -R engine_core_tests -V

      - name: Vulkan doctor detection
        run: |
          set +e
          ./build/${{ matrix.preset }}/tools/engine/engine \
            doctor --require vulkan --json > doctor-vulkan.json
          code=$?
          set -e
          cat doctor-vulkan.json
          test "$code" -eq 0
          python3 - <<'PY'
          import json
          with open("doctor-vulkan.json", encoding="utf-8") as input_file:
              document = json.load(input_file)
          assert document["vulkan"]["loader"] is True
          assert document["vulkan"]["lavapipe"] is True
          assert document["vulkan"]["descriptorIndexing"] is True
          names = [device["name"].lower() for device in document["vulkan"]["devices"]]
          assert any("llvmpipe" in name for name in names), names
          assert any(
              device["descriptorIndexing"]["supported"]
              for device in document["vulkan"]["devices"]
          )
          assert document["requirements"]["passed"] is True
          print("lavapipe detected:", names)
          PY

      - name: Vulkan doctor missing ICD
        run: |
          set +e
          VK_ICD_FILENAMES=/tmp/engine-no-icd.json \
          VK_DRIVER_FILES=/tmp/engine-no-icd.json \
            ./build/${{ matrix.preset }}/tools/engine/engine doctor --require vulkan --json \
            > doctor-no-icd.json
          code=$?
          set -e
          test "$code" -eq 8
          python3 - <<'PY'
          import json
          with open("doctor-no-icd.json", encoding="utf-8") as input_file:
              document = json.load(input_file)
          assert document["vulkan"]["descriptorIndexing"] is False
          assert document["requirements"]["passed"] is False
          assert document["requirements"]["failed"] == ["vulkan"]
          print("missing ICD correctly failed with exit 8")
          PY

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.preset }}-artifacts
          if-no-files-found: ignore
          path: |
            build/${{ matrix.preset }}/Testing
            doctor-*.json

  windows:
    name: Windows (MSVC)
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up MSVC
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe was not found"
          }
          $installation = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $installation) {
            throw "No Visual Studio installation with the x64 C++ tools was found"
          }
          $vcvars = Join-Path $installation "VC\Auxiliary\Build\vcvarsall.bat"
          if (-not (Test-Path $vcvars)) {
            throw "vcvarsall.bat was not found at $vcvars"
          }
          $environment = cmd /c "`"$vcvars`" x64 >nul && set"
          foreach ($line in $environment) {
            if ($line -match '^([^=]+)=(.*)$') {
              "$($matches[1])=$($matches[2])" |
                Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }

      - name: Verify MSVC
        shell: pwsh
        run: |
          if (-not (Get-Command cl.exe -ErrorAction SilentlyContinue)) {
            throw "cl.exe was not found after vcvarsall"
          }
          cl.exe 2>&1 | Select-Object -First 1

      - name: Restore vcpkg binary cache
        uses: actions/cache@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-overlay/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Bootstrap vcpkg
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: |
          $vcpkgRoot = Join-Path $env:GITHUB_WORKSPACE "vcpkg"
          git clone https://github.com/microsoft/vcpkg $vcpkgRoot
          git -C $vcpkgRoot checkout 0e5eb43501dab17aa055dd54bd7a8c018f330fe2
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Set up Python tools
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt

      - name: Install Vulkan SDK for glslc
        shell: pwsh
        run: |
          choco install vulkan-sdk --version=1.4.363 -y --no-progress
          $sdk = "C:\VulkanSDK\1.4.363.0"
          $glslc = Join-Path $sdk "Bin\glslc.exe"
          if (-not (Test-Path $glslc)) {
            throw "Pinned glslc.exe was not found at $glslc"
          }
          $bin = Split-Path $glslc -Parent
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
          $env:Path = "$bin;$env:Path"
          glslc --version

      - name: Install software Vulkan ICD (lavapipe)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "lavapipe"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $archive = Join-Path $root "mesa-lavapipe-x64-26.2.6.7z"
          Invoke-WebRequest -Uri "https://github.com/mmozeiko/build-mesa/releases/download/26.2.6/mesa-lavapipe-x64-26.2.6.7z" -OutFile $archive
          $expected = "4ed980046a8d42de4efa74085f00e238a51c774b854d63ecece6dfee59ab3bf3"
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "lavapipe archive checksum mismatch: $actual"
          }
          $sevenZip = Join-Path $env:ProgramFiles "7-Zip\7z.exe"
          if (-not (Test-Path $sevenZip)) {
            $sevenZip = "7z"
          }
          & $sevenZip x $archive "-o$root\mesa" -y
          if ($LASTEXITCODE -ne 0) {
            throw "lavapipe extraction failed"
          }
          $mesa = Join-Path $root "mesa"
          $icd = (Resolve-Path (Join-Path $mesa "lvp_icd.x86_64.json")).Path
          & reg.exe add "HKLM\SOFTWARE\Khronos\Vulkan\Drivers" /v $icd /t REG_DWORD /d 0 /f /reg:64
          if ($LASTEXITCODE -ne 0) {
            throw "lavapipe ICD registration failed"
          }
          $mesa | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          Write-Host "Registered lavapipe ICD: $icd"

      - name: Install pinned CMake and Ninja
        shell: pwsh
        run: |
          $cmakeVersion = $env:CMAKE_VERSION
          $ninjaVersion = $env:NINJA_VERSION
          $cmakeRoot = Join-Path $env:RUNNER_TEMP "cmake-$cmakeVersion"
          $ninjaRoot = Join-Path $env:RUNNER_TEMP "ninja-$ninjaVersion"
          Invoke-WebRequest -Uri "https://github.com/Kitware/CMake/releases/download/v$cmakeVersion/cmake-$cmakeVersion-windows-x86_64.zip" -OutFile "$env:RUNNER_TEMP\cmake.zip"
          Invoke-WebRequest -Uri "https://github.com/ninja-build/ninja/releases/download/v$ninjaVersion/ninja-win.zip" -OutFile "$env:RUNNER_TEMP\ninja.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\cmake.zip" -DestinationPath $cmakeRoot -Force
          Expand-Archive -Path "$env:RUNNER_TEMP\ninja.zip" -DestinationPath $ninjaRoot -Force
          "$cmakeRoot\cmake-$cmakeVersion-windows-x86_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          $ninjaRoot | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Verify pinned build tools
        shell: pwsh
        run: |
          $cmakeVersion = (cmake --version | Select-Object -First 1)
          if ($cmakeVersion -ne "cmake version $env:CMAKE_VERSION") {
            throw "Unexpected CMake version: $cmakeVersion"
          }
          $ninjaVersion = ninja --version
          if ($ninjaVersion -ne $env:NINJA_VERSION) {
            throw "Unexpected Ninja version: $ninjaVersion"
          }
          $cmakeVersion
          $ninjaVersion

      - name: Configure
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: cmake --preset ci-windows

      - name: Build
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: cmake --build --preset ci-windows

      - name: Vulkan doctor detection (Windows)
        shell: pwsh
        run: |
          & .\build\ci-windows\tools\engine\engine.exe doctor --json --require vulkan | Out-File -Encoding utf8 doctor-windows.json
          if ($LASTEXITCODE -ne 0) {
            throw "engine doctor failed with exit code $LASTEXITCODE"
          }
          Get-Content doctor-windows.json
          @'
          import json
          with open("doctor-windows.json", encoding="utf-8-sig") as input_file:
              document = json.load(input_file)
          assert document["vulkan"]["loader"] is True
          assert document["vulkan"]["descriptorIndexing"] is True
          names = [device["name"].lower() for device in document["vulkan"]["devices"]]
          assert any("llvmpipe" in name for name in names), names
          assert document["requirements"]["passed"] is True
          print("Windows lavapipe detected:", names)
          '@ | & .\.venv\Scripts\python.exe -

      - name: Test
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: ctest --preset ci-windows --output-on-failure

      - name: Render test summary
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: ctest --preset ci-windows -R "engine_render_tests|engine_pbr_golden" -V

      - name: Core test summary
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
        run: ctest --preset ci-windows -R engine_core_tests -V

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-artifacts
          if-no-files-found: ignore
          path: |
            build/ci-windows/Testing
            doctor-*.json

  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install clang tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18 clang-tidy-18

      - name: Restore pinned Vulkan SDK cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.vulkan-sdk
          key: vulkan-sdk-1.4.363.0-${{ runner.os }}

      - name: Install pinned glslc
        run: |
          sdk_root="$GITHUB_WORKSPACE/.vulkan-sdk/1.4.363.0/x86_64"
          if [ ! -x "$sdk_root/bin/glslc" ]; then
            archive="$RUNNER_TEMP/vulkansdk-linux-x86_64-1.4.363.0.tar.xz"
            curl -fsSL -o "$archive" \
              "https://sdk.lunarg.com/sdk/download/1.4.363.0/linux/vulkansdk-linux-x86_64-1.4.363.0.tar.xz"
            expected="197962f5cbf80baf2775a03336a01cee7c8745686c65aaa70d3f751ade4d7e43"
            actual="$(sha256sum "$archive" | cut -d ' ' -f1)"
            if [ "$actual" != "$expected" ]; then
              echo "Vulkan SDK checksum mismatch: $actual" >&2
              exit 1
            fi
            mkdir -p "$GITHUB_WORKSPACE/.vulkan-sdk"
            tar -xJf "$archive" -C "$GITHUB_WORKSPACE/.vulkan-sdk"
          fi
          test -x "$sdk_root/bin/glslc"
          echo "$sdk_root/bin" >> "$GITHUB_PATH"
          echo "VULKAN_SDK=$sdk_root" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$sdk_root/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          "$sdk_root/bin/glslc" --version

      - name: Restore vcpkg binary cache
        uses: actions/cache@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-overlay/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout 0e5eb43501dab17aa055dd54bd7a8c018f330fe2
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Install pinned CMake and Ninja
        run: |
          cmake_archive="/tmp/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz"
          ninja_archive="/tmp/ninja-${NINJA_VERSION}-linux.zip"
          curl -fsSL -o "$cmake_archive" \
            "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz"
          curl -fsSL -o "$ninja_archive" \
            "https://github.com/ninja-build/ninja/releases/download/v${NINJA_VERSION}/ninja-linux.zip"
          mkdir -p "$HOME/.local/cmake" "$HOME/.local/bin"
          tar -xzf "$cmake_archive" -C "$HOME/.local/cmake" --strip-components=1
          unzip -q -o "$ninja_archive" -d "$HOME/.local/bin"
          echo "$HOME/.local/cmake/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify pinned build tools
        run: |
          test "$(cmake --version | head -n 1)" = "cmake version ${CMAKE_VERSION}"
          test "$(ninja --version)" = "${NINJA_VERSION}"
          cmake --version | head -n 1
          ninja --version

      - name: Configure for clang-tidy
        run: cmake --preset ci-linux-clang

      - name: Generate shaders for clang-tidy
        run: cmake --build --preset ci-linux-clang --target engine_render_shaders

      - name: clang-format
        run: |
          find engine tools tests -type f \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' \) -print0 \
            | xargs -0 clang-format-18 --dry-run --Werror

      - name: clang-tidy
        run: |
          find engine tools tests -type f -name '*.cpp' -print0 \
            | xargs -0 clang-tidy-18 -p build/ci-linux-clang --warnings-as-errors='*'

  linux-asan:
    name: Linux ASan/UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore vcpkg binary cache
        uses: actions/cache@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-overlay/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout 0e5eb43501dab17aa055dd54bd7a8c018f330fe2
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Set up Python tools
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-dev.txt

      - name: Install Vulkan and lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan1 mesa-vulkan-drivers vulkan-tools vulkan-validationlayers \
            g++-14 libx11-dev libxft-dev libxext-dev libwayland-dev \
            libxkbcommon-dev libegl1-mesa-dev xvfb openbox

      - name: Restore pinned Vulkan SDK cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.vulkan-sdk
          key: vulkan-sdk-1.4.363.0-${{ runner.os }}

      - name: Install pinned glslc
        run: |
          sdk_root="$GITHUB_WORKSPACE/.vulkan-sdk/1.4.363.0/x86_64"
          if [ ! -x "$sdk_root/bin/glslc" ]; then
            archive="$RUNNER_TEMP/vulkansdk-linux-x86_64-1.4.363.0.tar.xz"
            curl -fsSL -o "$archive" \
              "https://sdk.lunarg.com/sdk/download/1.4.363.0/linux/vulkansdk-linux-x86_64-1.4.363.0.tar.xz"
            expected="197962f5cbf80baf2775a03336a01cee7c8745686c65aaa70d3f751ade4d7e43"
            actual="$(sha256sum "$archive" | cut -d ' ' -f1)"
            if [ "$actual" != "$expected" ]; then
              echo "Vulkan SDK checksum mismatch: $actual" >&2
              exit 1
            fi
            mkdir -p "$GITHUB_WORKSPACE/.vulkan-sdk"
            tar -xJf "$archive" -C "$GITHUB_WORKSPACE/.vulkan-sdk"
          fi
          test -x "$sdk_root/bin/glslc"
          echo "$sdk_root/bin" >> "$GITHUB_PATH"
          echo "VULKAN_SDK=$sdk_root" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$sdk_root/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          "$sdk_root/bin/glslc" --version

      - name: Verify glslc
        run: |
          glslc --version
          test "$(command -v glslc)" = "$VULKAN_SDK/bin/glslc"

      - name: Select the lavapipe ICD
        run: |
          icd="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          echo "Using $icd"

      - name: Install pinned CMake and Ninja
        run: |
          cmake_archive="/tmp/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz"
          ninja_archive="/tmp/ninja-${NINJA_VERSION}-linux.zip"
          curl -fsSL -o "$cmake_archive" \
            "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz"
          curl -fsSL -o "$ninja_archive" \
            "https://github.com/ninja-build/ninja/releases/download/v${NINJA_VERSION}/ninja-linux.zip"
          mkdir -p "$HOME/.local/cmake" "$HOME/.local/bin"
          tar -xzf "$cmake_archive" -C "$HOME/.local/cmake" --strip-components=1
          unzip -q -o "$ninja_archive" -d "$HOME/.local/bin"
          echo "$HOME/.local/cmake/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify pinned build tools
        run: |
          test "$(cmake --version | head -n 1)" = "cmake version ${CMAKE_VERSION}"
          test "$(ninja --version)" = "${NINJA_VERSION}"
          cmake --version | head -n 1
          ninja --version

      - name: Configure
        run: cmake --preset linux-asan -DCMAKE_CXX_COMPILER=g++-14

      - name: Build
        run: cmake --build --preset linux-asan

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" bash -c '
            openbox --sm-disable &
            wm=$!
            sleep 1
            ctest --preset linux-asan --output-on-failure
            code=$?
            kill "$wm" 2>/dev/null || true
            exit "$code"
          '

      - name: Core test summary
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --preset linux-asan -R engine_core_tests -V

      - name: Vulkan doctor detection (ASan/UBSan)
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set +e
          ./build/linux-asan/tools/engine/engine \
            doctor --require vulkan --json > doctor-asan.json
          code=$?
          set -e
          cat doctor-asan.json
          test "$code" -eq 0
          python3 - <<'PY'
          import json
          with open("doctor-asan.json", encoding="utf-8") as input_file:
              document = json.load(input_file)
          assert document["vulkan"]["lavapipe"] is True
          assert document["vulkan"]["descriptorIndexing"] is True
          names = [device["name"].lower() for device in document["vulkan"]["devices"]]
          assert any("llvmpipe" in name for name in names), names
          assert any(
              device["descriptorIndexing"]["supported"]
              for device in document["vulkan"]["devices"]
          )
          assert document["requirements"]["passed"] is True
          print("lavapipe detected under ASan/UBSan:", names)
          PY

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: linux-asan-artifacts
          if-no-files-found: ignore
          path: |
            build/linux-asan/Testing
            doctor-asan.json

  fuzz:
    name: Fuzz (Clang ASan)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore vcpkg binary cache
        uses: actions/cache@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/vcpkg-overlay/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout 0e5eb43501dab17aa055dd54bd7a8c018f330fe2
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Install Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Restore pinned Vulkan SDK cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.vulkan-sdk
          key: vulkan-sdk-1.4.363.0-${{ runner.os }}

      - name: Install pinned glslc
        run: |
          sdk_root="$GITHUB_WORKSPACE/.vulkan-sdk/1.4.363.0/x86_64"
          if [ ! -x "$sdk_root/bin/glslc" ]; then
            archive="$RUNNER_TEMP/vulkansdk-linux-x86_64-1.4.363.0.tar.xz"
            curl -fsSL -o "$archive" \
              "https://sdk.lunarg.com/sdk/download/1.4.363.0/linux/vulkansdk-linux-x86_64-1.4.363.0.tar.xz"
            expected="197962f5cbf80baf2775a03336a01cee7c8745686c65aaa70d3f751ade4d7e43"
            actual="$(sha256sum "$archive" | cut -d ' ' -f1)"
            if [ "$actual" != "$expected" ]; then
              echo "Vulkan SDK checksum mismatch: $actual" >&2
              exit 1
            fi
            mkdir -p "$GITHUB_WORKSPACE/.vulkan-sdk"
            tar -xJf "$archive" -C "$GITHUB_WORKSPACE/.vulkan-sdk"
          fi
          test -x "$sdk_root/bin/glslc"
          echo "$sdk_root/bin" >> "$GITHUB_PATH"
          echo "VULKAN_SDK=$sdk_root" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$sdk_root/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Install pinned CMake and Ninja
        run: |
          cmake_archive="/tmp/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz"
          ninja_archive="/tmp/ninja-${NINJA_VERSION}-linux.zip"
          curl -fsSL -o "$cmake_archive" \
            "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz"
          curl -fsSL -o "$ninja_archive" \
            "https://github.com/ninja-build/ninja/releases/download/v${NINJA_VERSION}/ninja-linux.zip"
          mkdir -p "$HOME/.local/cmake" "$HOME/.local/bin"
          tar -xzf "$cmake_archive" -C "$HOME/.local/cmake" --strip-components=1
          unzip -q -o "$ninja_archive" -d "$HOME/.local/bin"
          echo "$HOME/.local/cmake/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure fuzzers
        run: cmake --preset linux-fuzz

      - name: Build fuzzers
        run: cmake --build --preset linux-fuzz --target engine_gltf_fuzz engine_image_fuzz

      - name: Run short fuzz targets
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          mkdir -p "$RUNNER_TEMP/corpus/gltf" "$RUNNER_TEMP/corpus/image"
          cp tests/assets/m3/*.glb "$RUNNER_TEMP/corpus/gltf/"
          cp tests/assets/m3/*.png tests/assets/m3/*.jpg "$RUNNER_TEMP/corpus/image/"
          ./build/linux-fuzz/tests/engine_gltf_fuzz "$RUNNER_TEMP/corpus/gltf" \
            -max_total_time=30 -timeout=10 -rss_limit_mb=2048
          ./build/linux-fuzz/tests/engine_image_fuzz "$RUNNER_TEMP/corpus/image" \
            -max_total_time=30 -timeout=10 -rss_limit_mb=2048
